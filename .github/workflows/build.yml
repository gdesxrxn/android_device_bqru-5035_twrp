name: Build

on:
  workflow_dispatch:  

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Хронологический сдвиг: сначала грузим твой код с патчами
      - name: 1. Подключение твоего устройства и патчей (Strict path)
        uses: actions/checkout@v4
        with:
          path: workspace/device/tinno/v2600cn
          ref: '7.0'

      # НОВЫЙ ШАГ: Подготовка сервера (Установка пакетов для сборки AOSP 7.0)
      - name: 1.5. Установка зависимостей (build-essential, schedtool и др.)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      # 2. База (без изменений)
      - name: 2. Установка утилиты repo
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "~/.bin" >> $GITHUB_PATH
          git config --global user.name "sxrxn"
          git config --global user.email "356205156+gdesxrxn@users.noreply.github.com"
          git config --global color.ui false

      # 3. Инъекция патча и чистая загрузка
      - name: 3. Загрузка Android 7.0 (С внедрением Git-патчей)
        run: |
          cd workspace
          
          # 3.1 Инициализируем манифест
          repo init -u https://github.com/omnirom/android.git -b android-7.0 --depth=1
          
          # 3.2 ХИРУРГИЧЕСКИЙ ПЕРЕХВАТ: Накатываем патч по абсолютному пути
          cd .repo/manifests
          git apply $GITHUB_WORKSPACE/workspace/device/tinno/v2600cn/.github/patches/01-omni-aosp.patch
          git apply $GITHUB_WORKSPACE/workspace/device/tinno/v2600cn/.github/patches/02-omni-default.patch
          git commit -am "build: inject 01-omni-aosp.patch into manifest"
          cd ../../
          
          # 3.3 Синхронизация по идеальному манифесту
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          
          # 3.4 Внедряем оригинальное рекавери 7.0 от TeamWin
          rm -rf bootable/recovery
          git clone -b android-7.0 https://github.com/TeamWin/android_bootable_recovery.git bootable/recovery

      # 4. Удар (Изъятие файлов движка AOSP для реверс-инжиниринга)
      - name: 4. Подготовка файлов парсера AOSP
        run: |
          cd workspace
          # Создаем папку для выгрузки исходного кода движка
          mkdir -p $GITHUB_WORKSPACE/aosp_core_engine
          
          # Копируем полные файлы, которые отвечают за логику lunch и поиск Make-файлов
          cp build/core/product_config.mk $GITHUB_WORKSPACE/aosp_core_engine/
          cp build/core/product.mk $GITHUB_WORKSPACE/aosp_core_engine/
          cp build/core/envsetup.mk $GITHUB_WORKSPACE/aosp_core_engine/
          cp build/envsetup.sh $GITHUB_WORKSPACE/aosp_core_engine/

      # 5. Выгрузка в виде Артефакта
      - name: 5. Загрузка исходников движка на GitHub
        uses: actions/upload-artifact@v4
        with:
          name: aosp-build-engine-files
          path: aosp_core_engine/
